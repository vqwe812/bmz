<script>
const newsData = {
1:{cat:'Производство',date:'02 октября 2026',title:'БМЗ нарастил выпуск арматуры на 8% в третьем квартале',content:'<p>По итогам третьего квартала 2026 года ОАО «Белорусский металлургический завод» продемонстрировал уверенный рост производства ключевой продукции. Выпуск стальной арматуры увеличился на 8% по сравнению с аналогичным периодом прошлого года и составил свыше 620 тысяч тонн.</p><p>Основным фактором роста стала завершённая в начале года модернизация сортопрокатного стана «370». Обновлённое оборудование позволило не только увеличить скорость проката, но и расширить сортамент выпускаемой продукции за счёт введения новых диаметров и марок стали.</p><p>«Мы продолжаем курс на техническое перевооружение производства. Инвестиции в модернизацию уже дают ощутимый результат — растёт не только объём, но и качество продукции», — отметил главный инженер завода.</p>'},
2:{cat:'Экспорт',date:'28 сентября 2026',title:'Новый контракт на поставку метизов в Юго-Восточную Азию',content:'<p>ОАО «БМЗ» подписало долгосрочный контракт на поставку метизной продукции в страны Юго-Восточной Азии. Соглашение рассчитано на три года и предусматривает поставку более 15 000 тонн стальных канатов и проволоки различного назначения.</p><p>Это крупнейший экспортный контракт завода в регионе за последние пять лет.</p>'},
3:{cat:'Модернизация',date:'19 сентября 2026',title:'Запуск новой линии термической обработки проволоки',content:'<p>На метизном производстве БМЗ введена в эксплуатацию новая линия термической обработки проволоки. Проект реализован в рамках программы технической модернизации предприятия с инвестициями около 12 млн белорусских рублей.</p>'}
};

document.addEventListener('DOMContentLoaded', () => {
const params = new URLSearchParams(window.location.search);
const id = params.get('id') || '1';
const n = newsData[id] || newsData[1];
document.getElementById('niCat').textContent = n.cat;
document.getElementById('niTitle').innerHTML = n.title;
document.getElementById('niDate').textContent = n.date;
document.getElementById('niContent').innerHTML = n.content;
});
</script>
